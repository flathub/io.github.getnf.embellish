app-id: io.github.getnf.embellish
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: io.github.getnf.embellish

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --filesystem=~/.local/share/fonts:create

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0

modules:
  - name: gnome-autoar
    buildsystem: meson
    config-opts:
      - -Dgtk_doc=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gnome-autoar/0.4/gnome-autoar-0.4.5.tar.xz
        sha256: 838c5306fc38bfaa2f23abe24262f4bf15771e3303fb5dcb74f5b9c7a615dabe

  - name: embellish
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/getnf/embellish.git
        tag: v0.8.2
        commit: 4aa9ade135f2874e585a63910937f6292be808ec