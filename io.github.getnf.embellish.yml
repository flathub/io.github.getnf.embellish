app-id: io.github.getnf.embellish
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: embellish

finish-args:
    - --socket=wayland
    - --socket=fallback-x11
    - --share=ipc
    - --device=dri
    - --share=network
    - --filesystem=~/.local/share/fonts:create

cleanup:
    - /include
    - /lib/pkgconfig
    - /man
    - /share/doc
    - /share/man
    - /share/gtk-doc
    - /share/pkgconfig
    - /share/vala
    - "*.a"
    - "*.la"

modules:
  - name: embellish
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/getnf/embellish.git
        tag: v1.1.0
        commit: 268de999634d6ec38dc9439dde5e1b5bd3dab1fc